name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agtech
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: agtech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agtech -d agtech_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://agtech:ci-test-only@127.0.0.1:5432/agtech_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/ migrations/ scripts/

      - name: Run tests
        run: pytest tests/ -v --tb=short
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: python scripts/run_web_e2e.py

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck && npm run lint
        working-directory: mobile
      - name: Bundle JavaScript for Android and iOS (not native runtime evidence)
        run: npx expo export --platform android --platform ios --max-workers 2
        working-directory: mobile
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Compile Android test release with bundled JavaScript
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain --max-workers=2 -PreactNativeArchitectures=x86_64
        working-directory: mobile/android
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: android-internal-test-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
